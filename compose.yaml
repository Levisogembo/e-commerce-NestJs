services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - backend
    volumes:
      - redis_data:/data

  e-commerce:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./secrets/postgres_user:/run/secrets/postgres_user:ro
      - ./secrets/postgres_password:/run/secrets/postgres_password:ro
      - ./secrets/postgres_db:/run/secrets/postgres_db:ro
    networks:
      - backend
      - frontend

  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./secrets/postgres_user:/run/secrets/postgres_user:ro
      - ./secrets/postgres_password:/run/secrets/postgres_password:ro
      - ./secrets/postgres_db:/run/secrets/postgres_db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$(cat /run/secrets/postgres_user)']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - e-commerce
    networks:
      - backend

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3002:3000'
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_user:/run/secrets/grafana_admin_user:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    networks:
      - backend

  frontend-app:
    build:
      context: ../../../react-ecommerce
      dockerfile: Dockerfile
    image: react-ecommerce
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - e-commerce
    networks:
      - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
